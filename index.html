<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster-Resilient Logistics Prototype</title>
    <!-- โหลด Leaflet CSS สำหรับทำแผนที่ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f4f4f9; display: flex; height: 100vh; }
        .sidebar { width: 350px; background: #fff; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        .main-map { flex-grow: 1; height: 100%; }
        h2 { color: #333; font-size: 1.2rem; border-bottom: 2px solid #ff4d4d; padding-bottom: 8px; }
        .card { background: #fafafa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-sos { background-color: #ff4d4d; color: white; margin-top: 10px; }
        .btn-sos:hover { background-color: #cc0000; }
        .btn-normal { background-color: #28a745; color: white; margin-top: 5px; }
        .btn-normal:hover { background-color: #1e7e34; }
        .log-box { background: #000; color: #0f0; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.85rem; height: 120px; overflow-y: auto; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .status-ok { background: #d4edda; color: #155724; }
        .status-danger { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <!-- ฝั่งควบคุม / แดชบอร์ดคนขับ -->
    <div class="sidebar">
        <div>
            <h2>🚚 ระบบจัดการขนส่งฉุกเฉิน</h2>
            
            <div class="card">
                <h3>สถานะคนขับ (Driver Panel)</h3>
                <p><strong>คนขับ:</strong> สมชาย ใจดี (รถบรรทุก 01)</p>
                <p><strong>สถานะปัจจุบัน:</strong> <span id="driverStatus" class="status-badge status-ok">เดินทางปกติ</span></p>
                <p style="font-size: 0.85rem; color: #666;" id="gpsText">พิกัด GPS: กำลังค้นหา...</p>
                
                <button class="btn-sos" onclick="triggerSOS()">🚨 แจ้งเหตุฉุกเฉิน / น้ำท่วม</button>
                <button class="btn-normal" onclick="resolveSOS()">✅ เส้นทางผ่านได้ (ปกติ)</button>
            </div>

            <div class="card">
                <h3>ศูนย์ควบคุม (Admin Log)</h3>
                <div class="log-box" id="logBox">
                    [System] เริ่มต้นระบบติดตามภัยพิบัติ...<br>
                </div>
            </div>
        </div>
        
        <p style="font-size: 0.75rem; text-align: center; color: #999;">Emergency Logistics Prototype v1.0</p>
    </div>

    <!-- ฝั่งแผนที่แสดงผล (Admin Map Dashboard) -->
    <div id="map" class="main-map"></div>

    <!-- โหลด Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // -----------------------------------------------------------------
        // 📌 จุดที่ต้องแก้: เอา URL ของเว็บแอป (ที่ได้จากการ Deploy Google Apps Script) มาวางแทนข้อความด้านล่างนี้
        // -----------------------------------------------------------------
        const WEB_APP_URL = "เอา_URL_ของเว็บแอปมาวางตรงนี้"; 

        const defaultLat = 13.7563;
        const defaultLng = 100.5018;
        
        const map = L.map('map').setView([defaultLat, defaultLng], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let truckMarker = L.marker([defaultLat, defaultLng]).addTo(map)
            .bindPopup("<b>รถขนส่ง 01: สมชาย</b><br>สถานะ: ปกติ")
            .openPopup();

        const logBox = document.getElementById('logBox');
        const driverStatus = document.getElementById('driverStatus');
        const gpsText = document.getElementById('gpsText');

        let currentLat = defaultLat;
        let currentLng = defaultLng;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;
                truckMarker.setLatLng([currentLat, currentLng]);
                gpsText.innerText = `พิกัด GPS: ${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
            }, error => {
                console.warn("ไม่สามารถดึง GPS จริงได้ ใช้ค่าเริ่มต้นแทน");
            }, { enableHighAccuracy: true });
        }

        // ฟังก์ชันส่งข้อมูลไป Google Sheets & LINE
        function sendDataToSheet(statusText) {
            if (WEB_APP_URL.includes("https://script.google.com/macros/s/AKfycbw0PYkgDa-Q4wY-Aki_W5k6gWHKCk8k3dMWw6tJlrd7oRHq2pQ5JsVwZhvKfYqclw/exec")) {
                console.warn("ยังไม่ได้ใส่ Web App URL");
                return;
            }

            const payload = {
                driverName: "สมชาย ใจดี (รถบรรทุก 01)",
                status: statusText,
                lat: currentLat,
                lng: currentLng
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                console.log("ส่งข้อมูลสำเร็จ!");
            }).catch(error => {
                console.error("Error:", error);
            });
        }

        function triggerSOS() {
            driverStatus.className = "status-badge status-danger";
            driverStatus.innerText = "🚨 เกิดเหตุฉุกเฉิน / น้ำท่วม!";
            
            truckMarker.bindPopup("<b style='color:red;'>🚨 รถขนส่ง 01 ขอความช่วยเหลือ!</b><br>พื้นที่น้ำท่วมทางขาด").openPopup();
            
            const timeStr = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${timeStr}] <span style="color:#ff4d4d;">SOS! ส่งข้อมูลไป Cloud แล้ว</span><br>`;
            logBox.scrollTop = logBox.scrollHeight;

            sendDataToSheet("เกิดเหตุฉุกเฉิน / น้ำท่วม");
            alert("ส่งสัญญาณขอความช่วยเหลือและบันทึกลงระบบเรียบร้อย!");
        }

        function resolveSOS() {
            driverStatus.className = "status-badge status-ok";
            driverStatus.innerText = "เดินทางปกติ";
            
            truckMarker.bindPopup("<b>รถขนส่ง 01: สมชาย</b><br>สถานะ: ปกติ").openPopup();
            
            const timeStr = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${timeStr}] <span style="color:#0f0;">สถานการณ์ปกติ อัปเดตลง Cloud แล้ว</span><br>`;
            logBox.scrollTop = logBox.scrollHeight;

            sendDataToSheet("เดินทางปกติ");
        }
    </script>
</body>
</html>
